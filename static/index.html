<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accord Service Manual</title>
<link rel="icon" href="/static/honda.svg" type="image/svg+xml">
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<style>
  @font-face { font-family: "Geist"; src: url("/static/vendor/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  /* Palette and shapes follow Vercel's eve chat template (shadcn neutral) */
  :root {
    color-scheme: light;
    --background: oklch(0.971 0 0); --foreground: oklch(0.16 0 0);
    --card: oklch(1 0 0); --muted: oklch(0.94 0 0); --muted-foreground: oklch(0.5 0 0);
    --border: oklch(0.916 0 0); --destructive: oklch(0.577 0.245 27.325);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0); --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
      --border: oklch(1 0 0 / 10%); --destructive: oklch(0.704 0.191 22.216);
    }
  }
  * { box-sizing: border-box; border-color: var(--border); }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; background: var(--background); color: var(--foreground);
    font: 15px/1.6 "Geist", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  button, textarea { font: inherit; color: inherit; }
  button:not(:disabled) { cursor: pointer; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 14px; }
  .mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--foreground); color: var(--background); }
  .mark svg { width: 19px; height: 19px; }
  .ghost { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  .ghost:hover { background: var(--muted); }
  body:not(.chatting) #new-chat { visibility: hidden; }

  #scroll { flex: 1; overflow-y: auto; padding: 0 16px; }
  .column { width: 100%; max-width: 42rem; margin: 0 auto; }

  #welcome { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 24px 0 12vh; gap: 28px; }
  body.chatting #welcome { display: none; }
  #welcome .hero { text-align: center; }
  #welcome .hero .mark { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 18px; }
  #welcome .hero .mark svg { width: 40px; height: 40px; }
  #welcome h1 { margin: 0; line-height: 1.25; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  #welcome p { margin: 6px 0 0; color: var(--muted-foreground); }

  #suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
  #suggestions button {
    width: 100%; height: 100%; text-align: left; border: 1px solid var(--border); background: transparent;
    border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.4; transition: background .15s;
  }
  #suggestions button:hover { background: var(--card); }
  #suggestions small { display: block; color: var(--muted-foreground); font-size: 12.5px; margin-top: 2px; }
  @media (max-width: 520px) { #suggestions { grid-template-columns: 1fr; } }

  #thread { display: flex; flex-direction: column; gap: 24px; padding: 16px 0 24px; }
  .user { align-self: flex-end; max-width: 85%; border: 1px solid var(--border); background: var(--muted); border-radius: 18px; padding: 6px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
  .bot > :first-child { margin-top: 0; }
  .bot > :last-child { margin-bottom: 0; }
  .bot table { border-collapse: collapse; display: block; overflow-x: auto; }
  .bot th, .bot td { border: 1px solid var(--border); padding: 4px 8px; }
  .bot code { background: var(--muted); border-radius: 4px; padding: 1px 4px; font-size: .9em; }
  .bot figure { margin: 16px 0 0; }
  .bot img { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); background: #fff; }
  .bot figcaption { font-size: 12.5px; color: var(--muted-foreground); margin-top: 4px; }
  .bot.error { color: var(--destructive); }
  .shimmer {
    background: linear-gradient(90deg, var(--muted-foreground) 0%, var(--foreground) 45%, var(--muted-foreground) 90%);
    background-size: 220% 100%; background-clip: text; -webkit-background-clip: text; color: transparent;
    animation: shimmer 1.8s linear infinite;
  }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  @media (prefers-reduced-motion: reduce) { .shimmer { animation: none; } }

  #dock { padding: 0 16px 16px; }
  body:not(.chatting) #dock { display: none; }
  #composer {
    border: 1px solid var(--border); background: var(--card); border-radius: 14px;
    box-shadow: 0 1px 2px oklch(0 0 0 / 5%); transition: box-shadow .15s;
  }
  #composer:focus-within { box-shadow: 0 0 0 1px oklch(0.5 0 0 / 25%), 0 1px 2px oklch(0 0 0 / 5%); }
  #composer textarea {
    display: block; width: 100%; min-height: 48px; max-height: 8rem; resize: none; border: 0; outline: 0;
    background: transparent; padding: 12px 16px 4px; line-height: 24px;
  }
  #composer textarea::placeholder { color: var(--muted-foreground); }
  #composer .bar { display: flex; align-items: center; justify-content: space-between; padding: 4px 12px 8px 16px; }
  #composer .hint { font-size: 12px; color: var(--muted-foreground); }
  #send { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 8px; background: var(--foreground); color: var(--background); }
  #send:disabled { opacity: .3; }
  #send svg { width: 15px; height: 15px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mark"><svg><use href="#honda"/></svg></span>Accord Service Manual</div>
  <button id="new-chat" class="ghost" type="button">New chat</button>
</header>

<div id="scroll">
  <div class="column" id="welcome">
    <div class="hero">
      <div class="mark"><svg><use href="#honda"/></svg></div>
      <h1>How can I help with your Accord?</h1>
      <p>Answers come from the Honda Accord 1994–1997 service manual, with page numbers.</p>
    </div>
    <form id="composer">
      <label class="sr-only" for="q">Question</label>
      <textarea id="q" rows="1" placeholder="Ask about a spec, procedure, or diagram…" autofocus></textarea>
      <div class="bar">
        <span class="hint">Enter to send · Shift+Enter for a new line</span>
        <button id="send" type="submit" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
    <ul id="suggestions" aria-label="Suggested questions"></ul>
  </div>
  <section class="column" id="thread" aria-live="polite"></section>
</div>
<div id="dock"><div class="column" id="dock-slot"></div></div>

<script>
// Each topic was checked against the manual's text; the note shows where it lives
const SUGGESTIONS = [
  ["Show me the under-dash fuse box diagram", "Diagram · p. 1054"],
  ["How do I adjust the timing belt tension?", "Engine · p. 92"],
  ["What is the spark plug gap?", "Ignition · p. 1128"],
  ["What are the valve clearance specs?", "Engine · p. 84"],
  ["How do I bleed the brakes?", "Brakes"],
  ["What is the maintenance schedule?", "Maintenance · p. 35"],
];

const $ = (s) => document.querySelector(s);
const welcome = $("#welcome"), thread = $("#thread"), scroller = $("#scroll");
const form = $("#composer"), q = $("#q"), send = $("#send"), dockSlot = $("#dock-slot");
let busy = false;

for (const [question, where] of SUGGESTIONS) {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.type = "button";
  b.append(question, Object.assign(document.createElement("small"), { textContent: where }));
  b.onclick = () => ask(question);
  li.append(b);
  $("#suggestions").append(li);
}

function sync() {
  send.disabled = busy || !q.value.trim();
  q.style.height = "auto";
  q.style.height = q.scrollHeight + "px";
}
q.addEventListener("input", sync);
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
});
form.addEventListener("submit", (e) => { e.preventDefault(); if (!send.disabled) ask(q.value.trim()); });

$("#new-chat").onclick = () => {
  thread.replaceChildren();
  document.body.classList.remove("chatting");
  welcome.insertBefore(form, $("#suggestions"));
  q.focus();
};

function addMsg(cls, text) {
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = text;
  thread.append(el);
  scroller.scrollTop = scroller.scrollHeight;
  return el;
}

async function ask(query) {
  if (busy) return;
  if (!document.body.classList.contains("chatting")) {
    document.body.classList.add("chatting");
    dockSlot.append(form);
  }
  addMsg("user", query);
  q.value = "";
  busy = true;
  sync();
  const reply = addMsg("bot shimmer", "Searching the manual…");
  try {
    const res = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query }) });
    const data = await res.json().catch(() => ({ detail: `Server error (${res.status})` }));
    if (!res.ok) throw new Error(data.detail || "Request failed");
    reply.className = "bot";
    // Model output is untrusted: render markdown, then sanitize before inserting
    reply.innerHTML = DOMPurify.sanitize(marked.parse(data.answer));
    for (const img of data.images) {
      const fig = document.createElement("figure");
      const el = Object.assign(document.createElement("img"), { src: img.src, alt: img.caption, loading: "lazy" });
      fig.append(el, Object.assign(document.createElement("figcaption"), { textContent: img.caption }));
      reply.append(fig);
    }
  } catch (err) {
    reply.className = "bot error";
    reply.textContent = "Error: " + err.message;
  }
  busy = false;
  sync();
  scroller.scrollTop = scroller.scrollHeight;
  q.focus();
}
</script>
</body>
</html>
